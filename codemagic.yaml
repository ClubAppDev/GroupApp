workflows:
  ios-demo-build:
    name: iOS Simulator Demo Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS app for simulator
        script: |
          flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - your-email@example.com

  ios-unsigned-device-build:
    name: iOS Unsigned Device IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Build unsigned iOS app artifact
        script: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/artifacts
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications" ]; then
            cp -R "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" build/artifacts/
          fi
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R "build/ios/iphoneos/Runner.app" build/artifacts/
          fi
          if [ -d "build/ios/archive/Runner.xcarchive" ]; then
            cp -R "build/ios/archive/Runner.xcarchive" build/artifacts/
          fi
          cd build/artifacts
          zip -r GroupApp-unsigned.zip . -x "*.DS_Store"
    artifacts:
      - build/artifacts/*.zip
    publishing:
      email:
        recipients:
          - your-email@example.com
